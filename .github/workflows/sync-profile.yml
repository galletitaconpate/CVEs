name: sync profile section

# Keeps the generated artifacts in step with the entries: the two indices and the
# README listing in this repository, and the "exploit development" section of the
# profile README. Runs when entries change, weekly to pick up CVSS scores that
# upstream published after an entry was filed, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "**/metadata.json"
      - "tools/**"
      - ".github/workflows/sync-profile.yml"
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      enrich:
        description: "Also fetch missing CVSS data from upstream databases"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          path: archive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill missing CVSS data
        # Skipped on push runs: a scheduled run is where late-published scores
        # get picked up, and a push should not depend on third-party APIs.
        if: github.event_name == 'schedule' || inputs.enrich
        env:
          # Raises the GitHub Advisory API rate limit from 60/h to 5000/h.
          # Supplied by Actions per run; no stored secret involved.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 archive/tools/enrich_metadata.py --delay 0.2

      - name: Regenerate indices
        # Must follow the backfill: the weakness index shows severity, so a
        # score change upstream rewrites index content too.
        run: python3 archive/tools/gen_indices.py

      - name: Commit archive changes
        working-directory: archive
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "archive already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh CVSS data and regenerate indices"
          git push

      # Everything below needs a token the default GITHUB_TOKEN cannot provide,
      # since that one is scoped to this repository. Without PROFILE_TOKEN the
      # steps above still run and this part is skipped rather than failing.
      - name: Check for profile token
        id: gate
        run: |
          if [ -n "${{ secrets.PROFILE_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROFILE_TOKEN is not set, so the profile README was not updated. Create a fine-grained PAT with Contents:write on galletitaconpate/galletitaconpate and store it as the PROFILE_TOKEN secret."
          fi

      - name: Check out profile repository
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: galletitaconpate/galletitaconpate
          token: ${{ secrets.PROFILE_TOKEN }}
          path: profile

      - name: Regenerate profile section
        if: steps.gate.outputs.ready == 'true'
        run: python3 archive/tools/gen_profile_section.py --write profile/README.md

      - name: Commit profile README
        if: steps.gate.outputs.ready == 'true'
        working-directory: profile
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "profile README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync exploit development section from verified-exploits"
          git push
