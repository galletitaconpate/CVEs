name: sync generated artifacts

# Keeps every generated artifact in step with the two sources of truth
# (*/metadata.json and data/profile.json): the indices here, the managed blocks
# of the profile README, and site-data.js on the website.
#
# Deliberately one workflow rather than one per destination. The backfill step
# calls three external APIs and mutates the metadata, so splitting it would
# double that load and let two concurrent runs push conflicting states, leaving
# the profile and the site reflecting different enrichment.
on:
  push:
    branches: [main]
    paths:
      - "**/metadata.json"
      - "data/**"
      - "tools/**"
      - ".github/workflows/sync-profile.yml"
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      enrich:
        description: "Also fetch missing CVSS data from upstream databases"
        type: boolean
        default: true

permissions:
  contents: write

# A push that lands while the cron is running would otherwise race it to the
# same branch and one of the two would fail to push.
concurrency:
  group: sync-artifacts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          path: archive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backfill missing CVSS data
        # Skipped on push runs: a scheduled run is where late-published scores
        # get picked up, and a push should not depend on third-party APIs.
        if: github.event_name == 'schedule' || inputs.enrich
        env:
          # Raises the GitHub Advisory API rate limit from 60/h to 5000/h.
          # Supplied by Actions per run; no stored secret involved.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 archive/tools/enrich_metadata.py --delay 0.2

      - name: Regenerate indices
        # Must follow the backfill: the weakness index shows severity, so a
        # score published upstream changes index content too.
        run: python3 archive/tools/gen_indices.py

      - name: Commit archive changes
        working-directory: archive
        run: |
          # Restricted to the generated artifacts on purpose. An unrestricted
          # `git add -A` here committed a stray __pycache__ file on the first run.
          git add -- '*metadata.json' README.md INDEX_BY_CLASS.md INDEX_BY_CWE.md
          if git diff --cached --quiet; then
            echo "archive already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh CVSS data and regenerate indices"
          git pull --rebase --autostash
          git push

      # Everything below writes to other repositories, which the default
      # GITHUB_TOKEN cannot do — it is scoped to this one. Without SYNC_TOKEN the
      # steps above still run and these are skipped rather than failing.
      - name: Check for sync token
        id: gate
        run: |
          if [ -n "${{ secrets.SYNC_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SYNC_TOKEN is not set, so the profile README and the website were not updated. Create one fine-grained PAT covering galletitaconpate/galletitaconpate and galletitaconpate/wolfhacking with Contents:write, and store it as the SYNC_TOKEN secret."
          fi

      - name: Check out profile repository
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: galletitaconpate/galletitaconpate
          token: ${{ secrets.SYNC_TOKEN }}
          path: profile

      - name: Check out website repository
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: galletitaconpate/wolfhacking
          token: ${{ secrets.SYNC_TOKEN }}
          path: site

      - name: Regenerate profile README blocks
        if: steps.gate.outputs.ready == 'true'
        run: python3 archive/tools/gen_profile_section.py --write profile/README.md

      - name: Regenerate website data
        if: steps.gate.outputs.ready == 'true'
        run: python3 archive/tools/gen_site_data.py --write site/site-data.js

      - name: Commit profile README
        if: steps.gate.outputs.ready == 'true'
        working-directory: profile
        run: |
          git add -- README.md
          if git diff --cached --quiet; then
            echo "profile README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync generated sections from verified-exploits"
          git pull --rebase --autostash
          git push

      - name: Commit website data
        if: steps.gate.outputs.ready == 'true'
        working-directory: site
        run: |
          git add -- site-data.js
          if git diff --cached --quiet; then
            echo "website data already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync site-data.js from verified-exploits"
          git pull --rebase --autostash
          git push
